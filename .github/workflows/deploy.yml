# 將靜態內容部屬到 GitHub Pages 的工作流程
name: Deploy static content to Pages

on:
  # 當推送至 main 分支時觸發
  push:
    branches: ['main']

# 設定 GITHUB_TOKEN 的權限以允許部屬到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允許一項並行執行，如果在部屬途中又有新的推送，則取消過時的部屬任務
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 部屬的單一任務
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上傳 dist 資料夾 (Vite 預設的打包輸出目錄)
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
